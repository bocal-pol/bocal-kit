<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { margin: 0; padding: 0; background: #ffffff; }
    #root { width: 1920px; height: 1080px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/@excalidraw/excalidraw@0.17.6/dist/excalidraw.production.min.js"></script>
  <script>
    async function renderExcalidraw(elements, appState, files) {
      try {
        const { exportToBlob } = ExcalidrawLib;
        const blob = await exportToBlob({
          elements,
          appState: {
            ...appState,
            exportWithDarkMode: false,
            exportBackground: true,
            viewBackgroundColor: "#ffffff",
          },
          files: files || {},
          getDimensions: () => ({ width: 1920, height: 1080, scale: 2 }),
        });
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
      } catch (err) {
        console.error("renderExcalidraw error:", err);
        throw err;
      }
    }

    window.renderExcalidraw = renderExcalidraw;
  </script>
</body>
</html>
